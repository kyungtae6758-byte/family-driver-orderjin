<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14263f">
  <meta name="description" content="가족대리운전 주문진점 전화 문의 안내">
  <title>가족대리운전 주문진점</title>
  <style>
    :root { --navy:#14263f; --blue:#25496f; --ink:#1b2938; --muted:#64748b; --bg:#f4f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif; color:var(--ink); background:var(--bg); }
    .wrap { width:min(100% - 32px, 620px); margin:0 auto; }
    header { background:var(--navy); color:#fff; padding:22px 0 38px; }
    .brand { display:flex; align-items:center; gap:11px; font-size:19px; font-weight:800; letter-spacing:-.5px; }
    .mark { width:42px; height:42px; display:grid; place-items:center; border:1px solid #ffffff55; border-radius:13px; font-size:23px; }
    .branch { margin:5px 0 0 53px; color:#d6e1ef; font-size:13px; }
    .hero { padding:36px 0 4px; }
    .eyebrow { color:#c4d5e9; font-size:13px; letter-spacing:.08em; }
    h1 { margin:10px 0 10px; font-size:clamp(28px,7vw,40px); line-height:1.25; letter-spacing:-1.4px; }
    .hero p { margin:0; color:#dce6f1; line-height:1.7; font-size:15px; }
    main { margin-top:-2px; padding-bottom:36px; }
    .call-card { background:#fff; border-radius:20px; padding:25px 20px; text-align:center; box-shadow:0 12px 34px #14263f12; }
    .call-card .small { color:var(--muted); font-size:14px; }
    .number { margin:8px 0 18px; font-size:clamp(29px,8vw,38px); font-weight:850; letter-spacing:.4px; color:var(--navy); }
    .call-btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:60px; border-radius:14px; background:var(--navy); color:#fff; text-decoration:none; font-size:19px; font-weight:800; }
    .call-btn:focus-visible { outline:3px solid #7db6f5; outline-offset:3px; }
    .hint { margin:13px 0 0; color:var(--muted); font-size:12px; }
    .info { margin-top:18px; background:#fff; border:1px solid #e5ebf2; border-radius:18px; padding:20px; }
    .info h2 { margin:0 0 13px; font-size:18px; }
    .item { display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-top:1px solid #edf1f5; }
    .item:first-of-type { border-top:0; }
    .ico { width:34px; height:34px; flex:0 0 34px; border-radius:10px; background:#edf3fa; display:grid; place-items:center; }
    .item strong { display:block; font-size:14px; }
    .item span { color:var(--muted); font-size:13px; line-height:1.5; }
    footer { padding:8px 0 28px; text-align:center; color:#718096; font-size:12px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand"><div class="mark" aria-hidden="true">🚘</div><div>가족대리운전</div></div>
      <div class="branch">주문진점</div>
      <section class="hero">
        <div class="eyebrow">FAMILY DRIVER · 주문진</div>
        <h1>귀갓길의 든든한 동행</h1>
        <p>주문진 지역 대리운전 문의<br>전화 한 통으로 편리하게 연락하세요.</p>
      </section>
    </div>
  </header>
  <main class="wrap">
    <section class="call-card" aria-label="전화 문의">
      <div class="small">가족대리운전 주문진점 대표번호</div>
      <div class="number">033-662-6668</div>
      <a class="call-btn" href="tel:0336626668" aria-label="033-662-6668로 전화하기">
        <span aria-hidden="true">☎</span> 전화 예약하기
      </a>
      <p class="hint">휴대폰에서 버튼을 누르면 전화 앱으로 연결됩니다.</p>
    </section>
    <section class="info">
      <h2>이용 안내</h2>
      <div class="item">
        <div class="ico" aria-hidden="true">📍</div>
        <div><strong>주문진 지역</strong><span>주문진 중심 대리운전 문의</span></div>
      </div>
      <div class="item">
        <div class="ico" aria-hidden="true">📞</div>
        <div><strong>전화로 간편하게</strong><span>출발지와 목적지를 전화로 알려주세요.</span></div>
      </div>
      <div class="item">
        <div class="ico" aria-hidden="true">🤝</div>
        <div><strong>가족대리운전 주문진점</strong><span>운행 가능 여부와 요금은 전화로 확인해 주세요.</span></div>
      </div>
    </section>
  </main>
  <footer class="wrap">가족대리운전 주문진점 · 033-662-6668</footer>
</body>
</html>
